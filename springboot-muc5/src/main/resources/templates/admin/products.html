<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản Lý Product - Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<style>
:root {
	--pastel-blue-bg: #eef5ff;
	--pastel-blue-main: #6cb2eb;
	--pastel-blue-light: #d0e7ff;
	--pastel-pink-main: #f8a5c2;
	--pastel-pink-light: #fde2e4;
	--pastel-pink-hover: #f78fb3;
	--text-color: #2c3e50;
}

body {
	font-family: 'Plus Jakarta Sans', sans-serif;
	background-color: var(--pastel-blue-bg);
	color: var(--text-color);
}

/* NAVBAR - Nền Xanh Dương Pastel */
.navbar-pastel {
	background-color: var(--pastel-blue-main) !important;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
}

/* CARD CHÍNH */
.main-card {
	border-radius: 16px;
	border: none;
	background: #ffffff;
	box-shadow: 0 4px 15px rgba(108, 178, 235, 0.12);
}

/* BẢNG - HEADER HỒNG PASTEL XEN KẼ */
.table thead {
	background-color: var(--pastel-pink-light);
	color: #d63031;
}

.table-hover tbody tr:hover {
	background-color: #f7faff;
}

/* NÚT BẤM */
.btn-modern {
	border-radius: 10px;
	font-weight: 600;
	transition: all 0.2s ease;
}

/* Nút Thêm Mới - Hồng Pastel */
.btn-pink {
	background-color: var(--pastel-pink-main);
	color: #ffffff;
	border: none;
}
.btn-pink:hover {
	background-color: var(--pastel-pink-hover);
	color: #ffffff;
}

/* Nút Tìm Kiếm / Lưu - Xanh Dương Pastel */
.btn-blue {
	background-color: var(--pastel-blue-main);
	color: #ffffff;
	border: none;
}
.btn-blue:hover {
	background-color: #4a90e2;
	color: #ffffff;
}

/* Nút Sửa / Xóa trong Bảng */
.btn-outline-edit {
	border: 1px solid var(--pastel-blue-main);
	color: var(--pastel-blue-main);
}
.btn-outline-edit:hover {
	background-color: var(--pastel-blue-main);
	color: #fff;
}

.btn-outline-del {
	border: 1px solid var(--pastel-pink-main);
	color: #e84393;
}
.btn-outline-del:hover {
	background-color: var(--pastel-pink-main);
	color: #fff;
}

/* BADGE */
.badge-category {
	background-color: var(--pastel-blue-light);
	color: #1d68a7;
	font-weight: 600;
	padding: 6px 12px;
	border-radius: 8px;
}

.price-text {
	color: #e84393;
	font-weight: 700;
}

/* MODAL - Header Xanh Dương Pastel */
.modal-content {
	border-radius: 16px;
	border: none;
	overflow: hidden;
}

.modal-header-blue {
	background-color: var(--pastel-blue-main);
	color: #ffffff;
}

/* PHÂN TRANG - Hồng Pastel */
.pagination .page-item.active .page-link {
	background-color: var(--pastel-pink-main);
	border-color: var(--pastel-pink-main);
}
.pagination .page-link {
	color: var(--pastel-blue-main);
	border-radius: 8px;
	margin: 0 2px;
}
</style>
</head>
<body>

	<!-- NAVBAR  -->
	<nav class="navbar navbar-expand-lg navbar-dark navbar-pastel py-3 mb-4">
		<div class="container">
			<a class="navbar-brand fw-bold text-white" href="/"><i class="fa-solid fa-bolt text-warning me-2"></i>MINXI STORE</a>
			<div class="d-flex gap-2">
				<a href="/" class="btn btn-outline-light btn-sm btn-modern"><i class="fa-solid fa-house me-1"></i> Trang chủ</a> 
				<a href="/admin/categories" class="btn btn-outline-light btn-sm btn-modern"><i class="fa-solid fa-layer-group me-1"></i> Category</a> 
				<a href="/admin/products" class="btn btn-light text-primary btn-sm btn-modern fw-bold"><i class="fa-solid fa-box-archive me-1"></i> Product</a>
			</div>
		</div>
	</nav>

	<div class="container">
		<!-- BẢNG DANH SÁCH PRODUCT -->
		<div class="card main-card p-4">
			<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
				<div>
					<h4 class="fw-bold m-0" style="color: var(--pastel-blue-main);">
						<i class="fa-solid fa-boxes-stacked me-2"></i>Danh Sách Sản Phẩm
					</h4>
					<p class="text-muted small m-0 mt-1">Quản lý kho hàng và thông tin sản phẩm</p>
				</div>

				<div class="d-flex gap-2 align-items-center">
					<div class="input-group" style="max-width: 260px;">
						<input type="text" id="prodSearch" class="form-control border-end-0" placeholder="Tìm sản phẩm..." style="border-radius: 10px 0 0 10px;">
						<button class="btn btn-blue" style="border-radius: 0 10px 10px 0;" onclick="loadProducts(0)">
							<i class="fa-solid fa-magnifying-glass"></i>
						</button>
					</div>
					<!-- NÚT THÊM SẢN PHẨM (Hồng Pastel) -->
					<button class="btn btn-pink btn-modern d-flex align-items-center gap-2 px-3 py-2" onclick="openAddModal()">
						<i class="fa-solid fa-plus"></i> Thêm Sản Phẩm
					</button>
				</div>
			</div>

			<!-- TABLE (Header Hồng Pastel) -->
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead>
						<tr>
							<th class="text-center py-3" style="width: 80px;">ID</th>
							<th class="py-3" style="width: 90px;">Ảnh</th>
							<th class="py-3">Tên Product</th>
							<th class="py-3" style="width: 150px;">Giá Bán</th>
							<th class="py-3" style="width: 180px;">Category</th>
							<th class="text-center py-3" style="width: 160px;">Thao tác</th>
						</tr>
					</thead>
					<tbody id="productTableBody">
						<!-- Render bằng AJAX -->
					</tbody>
				</table>
			</div>

			<!-- PHÂN TRANG -->
			<div class="d-flex justify-content-center mt-4">
				<nav>
					<ul class="pagination pagination-sm mb-0" id="prodPagination"></ul>
				</nav>
			</div>
		</div>
	</div>

	<!-- THÊM / SỬA PRODUCT -->
	<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content shadow">
				<!-- Header Modal Xanh Dương Pastel -->
				<div class="modal-header modal-header-blue">
					<h5 class="modal-title fw-bold" id="modalTitle">
						<i class="fa-solid fa-box me-2"></i>Thêm Sản Phẩm
					</h5>
					<button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body p-4">
					<input type="hidden" id="productId">
					<div class="mb-3">
						<label class="form-label fw-semibold">Tên Sản Phẩm <span class="text-danger">*</span></label> 
						<input type="text" id="productName" class="form-control" placeholder="Nhập tên sản phẩm...">
					</div>
					<div class="mb-3">
						<label class="form-label fw-semibold">Giá Bán (VNĐ) <span class="text-danger">*</span></label> 
						<input type="number" id="productPrice" class="form-control" placeholder="Ví dụ: 15000000">
					</div>
					<div class="mb-3">
						<label class="form-label fw-semibold">Danh Mục Category <span class="text-danger">*</span></label> 
						<select id="productCategoryId" class="form-select">
							<option value="">-- Chọn Category --</option>
						</select>
					</div>
					<div class="mb-3">
						<label class="form-label fw-semibold">Link Ảnh Product</label> 
						<input type="text" id="productImages" class="form-control" placeholder="https://...">
					</div>
				</div>
				<div class="modal-footer bg-light">
					<button type="button" class="btn btn-secondary btn-modern" data-bs-dismiss="modal">Hủy</button>
					<button type="button" id="btnSave" class="btn btn-pink btn-modern px-4" onclick="saveProduct()">Lưu Product</button>
				</div>
			</div>
		</div>
	</div>

	<script>
    let curPage = 0;
    let productModal;

    $(document).ready(function() {
        productModal = new bootstrap.Modal(document.getElementById('productModal'));
        loadCatDropdown();
        loadProducts(0);
    });

    function loadProducts(page) {
        curPage = page;
        let kw = $('#prodSearch').val() || '';
        let query = `{
            searchProducts(keyword: "${kw}", page: ${curPage}, size: 5) {
                content {
                    id name price images
                    category { id name }
                }
                totalPages pageNumber
            }
        }`;

        $.ajax({
            url: '/graphql',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query }),
            success: function(res) {
                let data = res.data.searchProducts;
                let html = '';
                if (!data.content || data.content.length === 0) {
                    html = `<tr><td colspan="6" class="text-center py-4 text-muted">Không tìm thấy sản phẩm nào</td></tr>`;
                } else {
                    $.each(data.content, function(i, p) {
                        let img = p.images ? `<img src="${p.images}" width="42" height="42" class="rounded-3 shadow-sm" style="object-fit:cover;">` : `<span class="badge bg-secondary">No img</span>`;
                        let catName = p.category ? `<span class="badge badge-category">${p.category.name}</span>` : '<span class="text-muted">N/A</span>';
                        let catId = p.category ? p.category.id : '';

                        html += `<tr>
                            <td class="text-center fw-bold text-muted">${p.id}</td>
                            <td>${img}</td>
                            <td class="fw-bold">${p.name}</td>
                            <td class="price-text">${p.price.toLocaleString()} đ</td>
                            <td>${catName}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-edit me-1 btn-modern" onclick="openEditModal(${p.id}, '${p.name}', ${p.price}, '${p.images || ''}', '${catId}')"><i class="fa-solid fa-pen"></i> Sửa</button>
                                <button class="btn btn-sm btn-outline-del btn-modern" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i> Xóa</button>
                            </td>
                        </tr>`;
                    });
                }
                $('#productTableBody').html(html);
                renderPaging(data.totalPages, data.pageNumber);
            }
        });
    }

    function openAddModal() {
        $('#productId').val('');
        $('#productName').val('');
        $('#productPrice').val('');
        $('#productImages').val('');
        $('#productCategoryId').val('');
        $('#modalTitle').html('<i class="fa-solid fa-box me-2"></i>Thêm Sản Phẩm');
        $('#btnSave').text('Lưu Product');
        productModal.show();
    }

    function openEditModal(id, name, price, images, categoryId) {
        $('#productId').val(id);
        $('#productName').val(name);
        $('#productPrice').val(price);
        $('#productImages').val(images);
        $('#productCategoryId').val(categoryId);
        $('#modalTitle').html('<i class="fa-solid fa-pen-to-square me-2"></i>Sửa Sản Phẩm');
        $('#btnSave').text('Cập nhật');
        productModal.show();
    }

    function saveProduct() {
        let id = $('#productId').val();
        let name = $('#productName').val().trim();
        let price = parseFloat($('#productPrice').val());
        let images = $('#productImages').val().trim();
        let categoryId = parseInt($('#productCategoryId').val());

        if(!name || isNaN(price) || isNaN(categoryId)) {
            return alert('Vui lòng nhập Tên, Giá hợp lệ và Chọn Category!');
        }

        let safeImages = images.replace(/"/g, '\\"');

        let query = id ? `mutation {
            updateProduct(id: ${id}, input: { name: "${name}", price: ${price}, images: "${safeImages}", categoryId: ${categoryId} }) {
                id
                name
                images
            }
        }` : `mutation {
            createProduct(input: { name: "${name}", price: ${price}, images: "${safeImages}", categoryId: ${categoryId} }) {
                id
                name
                images
            }
        }`;

        $.ajax({
            url: '/graphql',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query }),
            success: function(res) {
                if (res.errors) {
                    console.error("Lỗi GraphQL:", res.errors);
                    alert("Lỗi khi lưu dữ liệu: " + res.errors[0].message);
                } else {
                    productModal.hide();
                    loadProducts(curPage);
                }
            },
            error: function(err) {
                console.error("Lỗi Server:", err);
                alert("Không thể kết nối đến Server!");
            }
        });
    }

    function deleteProduct(id) {
        if(confirm('Bạn có chắc chắn muốn xóa Product ID ' + id + '?')) {
            let query = `mutation { deleteProduct(id: ${id}) }`;
            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ query: query }),
                success: function() { loadProducts(curPage); }
            });
        }
    }

    function loadCatDropdown() {
        let query = `{ searchCategories(keyword: "", page: 0, size: 100) { content { id name } } }`;
        $.ajax({
            url: '/graphql',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query }),
            success: function(res) {
                let cats = res.data.searchCategories.content;
                let options = '<option value="">-- Chọn Category --</option>';
                $.each(cats, function(i, c) { options += `<option value="${c.id}">${c.name}</option>`; });
                $('#productCategoryId').html(options);
            }
        });
    }

    function renderPaging(totalPages, pageNum) {
        let html = '';
        if (totalPages <= 1) {
            $('#prodPagination').html('');
            return;
        }
        for (let i = 0; i < totalPages; i++) {
            html += `<li class="page-item ${i === pageNum ? 'active' : ''}"><a class="page-link" href="#" onclick="loadProducts(${i})">${i + 1}</a></li>`;
        }
        $('#prodPagination').html(html);
    }
    </script>
</body>
</html>
