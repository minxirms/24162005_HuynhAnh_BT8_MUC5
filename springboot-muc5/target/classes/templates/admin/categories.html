<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản Lý Category - Admin</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link
	href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
	rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script
	src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<style>
:root {
	--pastel-blue-bg: #eef5ff;
	--pastel-blue-main: #6cb2eb;
	--pastel-blue-light: #d0e7ff;
	--pastel-pink-main: #f8a5c2;
	--pastel-pink-light: #fde2e4;
	--pastel-pink-hover: #f78fb3;
	--text-color: #2c3e50;
}

body {
	font-family: 'Plus Jakarta Sans', sans-serif;
	background-color: var(--pastel-blue-bg);
	color: var(--text-color);
}

.navbar-pastel {
	background-color: var(--pastel-blue-main) !important;
	box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
}

.main-card {
	border-radius: 16px;
	border: none;
	background: #ffffff;
	box-shadow: 0 4px 15px rgba(108, 178, 235, 0.12);
}

.table thead {
	background-color: var(--pastel-pink-light);
	color: #d63031;
}

.table-hover tbody tr:hover {
	background-color: #f7faff;
}


.btn-modern {
	border-radius: 10px;
	font-weight: 600;
	transition: all 0.2s ease;
}


.btn-pink {
	background-color: var(--pastel-pink-main);
	color: #ffffff;
	border: none;
}

.btn-pink:hover {
	background-color: var(--pastel-pink-hover);
	color: #ffffff;
}


.btn-blue {
	background-color: var(--pastel-blue-main);
	color: #ffffff;
	border: none;
}

.btn-blue:hover {
	background-color: #4a90e2;
	color: #ffffff;
}


.btn-outline-edit {
	border: 1px solid var(--pastel-blue-main);
	color: var(--pastel-blue-main);
}

.btn-outline-edit:hover {
	background-color: var(--pastel-blue-main);
	color: #fff;
}

.btn-outline-del {
	border: 1px solid var(--pastel-pink-main);
	color: #e84393;
}

.btn-outline-del:hover {
	background-color: var(--pastel-pink-main);
	color: #fff;
}


.modal-content {
	border-radius: 16px;
	border: none;
	overflow: hidden;
}

.modal-header-blue {
	background-color: var(--pastel-blue-main);
	color: #ffffff;
}


.pagination .page-item.active .page-link {
	background-color: var(--pastel-pink-main);
	border-color: var(--pastel-pink-main);
}

.pagination .page-link {
	color: var(--pastel-blue-main);
	border-radius: 8px;
	margin: 0 2px;
}
</style>
</head>
<body>

	<nav
		class="navbar navbar-expand-lg navbar-dark navbar-pastel py-3 mb-4">
		<div class="container">
			<a class="navbar-brand fw-bold text-white" href="/"><i
				class="fa-solid fa-bolt text-warning me-2"></i>MINXI STORE</a>
			<div class="d-flex gap-2">
				<a href="/" class="btn btn-outline-light btn-sm btn-modern"><i
					class="fa-solid fa-house me-1"></i> Trang chủ</a> <a
					href="/admin/categories"
					class="btn btn-light text-primary btn-sm btn-modern fw-bold"><i
					class="fa-solid fa-layer-group me-1"></i> Category</a> <a
					href="/admin/products"
					class="btn btn-outline-light btn-sm btn-modern"><i
					class="fa-solid fa-box-archive me-1"></i> Product</a>
			</div>
		</div>
	</nav>

	<div class="container">
		<!-- BẢNG DANH SÁCH CATEGORY TOÀN MÀN HÌNH -->
		<div class="card main-card p-4">
			<div
				class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
				<div>
					<h4 class="fw-bold m-0" style="color: var(--pastel-blue-main);">
						<i class="fa-solid fa-list me-2"></i>Danh Sách Category
					</h4>
					<p class="text-muted small m-0 mt-1">Quản lý danh mục sản phẩm
						trong hệ thống</p>
				</div>

				<div class="d-flex gap-2 align-items-center">
					<div class="input-group" style="max-width: 260px;">
						<input type="text" id="catSearch"
							class="form-control border-end-0" placeholder="Tìm category..."
							style="border-radius: 10px 0 0 10px;">
						<button class="btn btn-blue" style="border-radius: 0 10px 10px 0;"
							onclick="loadCategories(0)">
							<i class="fa-solid fa-magnifying-glass"></i>
						</button>
					</div>
					<!-- NÚT MỞ MODAL THÊM CATEGORY (Hồng Pastel) -->
					<button
						class="btn btn-pink btn-modern d-flex align-items-center gap-2 px-3 py-2"
						onclick="openAddModal()">
						<i class="fa-solid fa-plus"></i> Thêm Danh Mục
					</button>
				</div>
			</div>

			<!-- TABLE (Header Hồng Pastel) -->
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead>
						<tr>
							<th class="text-center py-3" style="width: 80px;">ID</th>
							<th class="py-3" style="width: 100px;">Ảnh</th>
							<th class="py-3">Tên Danh Mục</th>
							<th class="text-center py-3" style="width: 160px;">Thao tác</th>
						</tr>
					</thead>
					<tbody id="categoryTableBody">
						<!-- Render bằng AJAX -->
					</tbody>
				</table>
			</div>

			<!-- PHÂN TRANG -->
			<div class="d-flex justify-content-center mt-4">
				<nav>
					<ul class="pagination pagination-sm mb-0" id="catPagination"></ul>
				</nav>
			</div>
		</div>
	</div>

	<!-- MODAL THÊM / SỬA CATEGORY -->
	<div class="modal fade" id="categoryModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content shadow">
				<!-- Header Modal Xanh Dương Pastel -->
				<div class="modal-header modal-header-blue">
					<h5 class="modal-title fw-bold" id="modalTitle">
						<i class="fa-solid fa-folder-plus me-2"></i>Thêm Danh Mục
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body p-4">
					<input type="hidden" id="categoryId">
					<div class="mb-3">
						<label class="form-label fw-semibold">Tên Danh Mục <span
							class="text-danger">*</span></label> <input type="text" id="categoryName"
							class="form-control" placeholder="Nhập tên danh mục...">
					</div>
					<div class="mb-3">
						<label class="form-label fw-semibold">Link Ảnh Category</label> <input
							type="text" id="categoryImages" class="form-control"
							placeholder="https://...">
					</div>
				</div>
				<div class="modal-footer bg-light">
					<button type="button" class="btn btn-secondary btn-modern"
						data-bs-dismiss="modal">Hủy</button>
					<button type="button" id="btnSave"
						class="btn btn-pink btn-modern px-4" onclick="saveCategory()">Lưu
						Category</button>
				</div>
			</div>
		</div>
	</div>

	<script>
    let curPage = 0;
    let categoryModal;

    $(document).ready(function() { 
        categoryModal = new bootstrap.Modal(document.getElementById('categoryModal'));
        loadCategories(0); 
    });

    function loadCategories(page) {
        curPage = page;
        let kw = $('#catSearch').val() || '';
        let query = `{
            searchCategories(keyword: "${kw}", page: ${curPage}, size: 5) {
                content { id name images }
                totalPages pageNumber
            }
        }`;

        $.ajax({
            url: '/graphql',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query }),
            success: function(res) {
                let data = res.data.searchCategories;
                let html = '';
                if (!data.content || data.content.length === 0) {
                    html = `<tr><td colspan="4" class="text-center py-4 text-muted">Không tìm thấy danh mục nào</td></tr>`;
                } else {
                    $.each(data.content, function(i, c) {
                        let img = c.images ? `<img src="${c.images}" width="42" height="42" class="rounded-circle shadow-sm" style="object-fit:cover;">` : `<span class="badge bg-secondary">No img</span>`;
                        html += `<tr>
                            <td class="text-center fw-bold text-muted">${c.id}</td>
                            <td>${img}</td>
                            <td class="fw-bold">${c.name}</td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-edit btn-modern me-1" onclick="openEditModal(${c.id}, '${c.name}', '${c.images || ''}')"><i class="fa-solid fa-pen"></i> Sửa</button>
                                <button class="btn btn-sm btn-outline-del btn-modern" onclick="deleteCat(${c.id})"><i class="fa-solid fa-trash"></i> Xóa</button>
                            </td>
                        </tr>`;
                    });
                }
                $('#categoryTableBody').html(html);
                renderPaging(data.totalPages, data.pageNumber);
            }
        });
    }

    function openAddModal() {
        $('#categoryId').val('');
        $('#categoryName').val('');
        $('#categoryImages').val('');
        $('#modalTitle').html('<i class="fa-solid fa-folder-plus me-2"></i>Thêm Danh Mục');
        $('#btnSave').text('Lưu Category');
        categoryModal.show();
    }

    function openEditModal(id, name, images) {
        $('#categoryId').val(id);
        $('#categoryName').val(name);
        $('#categoryImages').val(images);
        $('#modalTitle').html('<i class="fa-solid fa-pen-to-square me-2"></i>Sửa Danh Mục');
        $('#btnSave').text('Cập nhật');
        categoryModal.show();
    }

    function saveCategory() {
        let id = $('#categoryId').val();
        let name = $('#categoryName').val().trim();
        let images = $('#categoryImages').val().trim();

        if(!name) return alert('Vui lòng nhập tên category!');

        let query = id 
            ? `mutation { updateCategory(id: ${id}, name: "${name}", images: "${images}") { id } }`
            : `mutation { createCategory(name: "${name}", images: "${images}") { id } }`;

        $.ajax({
            url: '/graphql',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query }),
            success: function() {
                categoryModal.hide();
                loadCategories(curPage);
            }
        });
    }

    function deleteCat(id) {
        if(confirm('Bạn có chắc chắn muốn xóa Category ID ' + id + '?')) {
            let query = `mutation { deleteCategory(id: ${id}) }`;
            $.ajax({
                url: '/graphql',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ query: query }),
                success: function() { loadCategories(curPage); }
            });
        }
    }

    function renderPaging(totalPages, pageNum) {
        let html = '';
        if (totalPages <= 1) {
            $('#catPagination').html('');
            return;
        }
        for (let i = 0; i < totalPages; i++) {
            html += `<li class="page-item ${i === pageNum ? 'active' : ''}"><a class="page-link" href="#" onclick="loadCategories(${i})">${i + 1}</a></li>`;
        }
        $('#catPagination').html(html);
    }
    </script>
</body>
</html>
